name: iOS App Store release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Upload for internal testing or submit for automatic App Store release
        type: choice
        options: [testflight, app-store]
        default: testflight

permissions:
  contents: read

# Never cancel a running upload/submission. Keep the iOS version sequence separate
# from desktop-release.yml and its v* tags.
concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and upload iOS
    if: >-
      github.repository == 'lexluthor0304/NegativeConverter' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.IOS_RELEASE_CHANNEL != '')
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
      NC_P0_FIXTURES: '0'
      IOS_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || vars.IOS_RELEASE_CHANNEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Prepare independent iOS version and check submission readiness
        id: version
        run: node .github/scripts/prepare_ios_release.mjs
      # The manual signing that `tauri ios build --ci` configures refuses
      # Xcode-managed profiles, so the lane owns a manually managed App Store
      # profile created through the App Store Connect API for the exact
      # distribution certificate in MAS_CERT_DIST_P12 (first dispatch failed
      # on "Provisioning profile … is Xcode managed", 2026-10-26).
      - name: Check credentials and fetch the manual App Store profile
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_CERTIFICATE: ${{ secrets.MAS_CERT_DIST_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8 IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing iOS release credential: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          pem="$(openssl pkcs12 -in "$RUNNER_TEMP/ios.p12" -clcerts -nokeys -passin env:IOS_CERTIFICATE_PASSWORD 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/ios.p12" -clcerts -nokeys -passin env:IOS_CERTIFICATE_PASSWORD)"
          rm "$RUNNER_TEMP/ios.p12"
          sha1="$(printf '%s\n' "$pem" | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          echo "signing certificate SHA-1 $sha1"
          node scripts/ios-ensure-store-profile.mjs --bundle-id com.neoanaloglab.negativeconverter \
            --certificate-sha1 "$sha1" --name "Negative Converter iOS App Store" --out "$RUNNER_TEMP/ios.mobileprovision"
          python3 scripts/verify-ios-package.py --profile "$RUNNER_TEMP/ios.mobileprovision"
          echo "IOS_MOBILE_PROVISION=$(base64 < "$RUNNER_TEMP/ios.mobileprovision" | tr -d '\n')" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/ios.mobileprovision"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios-appstore-xcode26.6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: npm ci
      # The full Chrome smoke (including the realtime GPU-drag assertions) runs
      # in desktop CI on Linux for every pull request and every push to main,
      # and the iPhone/iPad layout job in ios-ci.yml covers the mobile shell.
      # GitHub's macOS runners have no trusted GPU path, so the studio-shell
      # smoke fails there on timing alone (first dispatch, 2026-10-26).
      - name: Check the shared editor, tooling and store copy
        run: npm test
      - name: Check iOS store assets before building or uploading
        if: env.IOS_RELEASE_CHANNEL == 'app-store'
        run: node scripts/check-ios-store-assets.mjs
      - name: Build production web assets without device fixtures
        run: |
          npm run build:web
          test ! -e negative2positive/dist/p0-fixtures
      # IOS_MOBILE_PROVISION comes from the profile step above (GITHUB_ENV).
      - name: Archive and export a distribution-signed iPhone and iPad app
        env:
          IOS_CERTIFICATE: ${{ secrets.MAS_CERT_DIST_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          IOS_CONFIG_PATH: ${{ steps.version.outputs.config }}
        run: |
          xcodebuild -version
          npm run tauri -- ios build --ci --target aarch64 --export-method app-store-connect --config "$IOS_CONFIG_PATH"
      - name: Verify exported signature, profile, identity and device families
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: python3 scripts/verify-ios-package.py --export-dir src-tauri/gen/apple/build/arm64 --output output/ios-release
      - name: Preserve the verified IPA and its provenance
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: |
            output/ios-release/NegativeConverter.ipa
            output/ios-release/verification.json
            output/ios-release/plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Install the release uploader
        run: gem install fastlane --no-document
      - name: Upload to TestFlight or submit for automatic release
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          IPA_PATH: ${{ github.workspace }}/output/ios-release/NegativeConverter.ipa
        run: fastlane ios publish
      - name: Record successful iOS review submission
        if: env.IOS_RELEASE_CHANNEL == 'app-store'
        env:
          IOS_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$IOS_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$IOS_TAG"
      - name: Report the actual delivery stage
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          if [ "$IOS_RELEASE_CHANNEL" = app-store ]; then
            echo "iOS $APP_VERSION ($BUILD_NUMBER) submitted for Apple review; configured for automatic release after approval. Approval and public availability are not yet verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "iOS $APP_VERSION ($BUILD_NUMBER) uploaded and processed for internal TestFlight testing; not submitted to App Review." >> "$GITHUB_STEP_SUMMARY"
          fi
