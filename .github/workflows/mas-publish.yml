name: Mac App Store publish

# Builds the sandboxed Mac App Store package of one release version and
# submits it with fastlane (fastlane/Fastfile, lane mac mas_upload). Called
# by desktop-release.yml for every release and by mas-catchup.yml for a
# release that was deferred while Apple still reviewed the previous version
# (docs/mas-release.md). The callers hold the "mas-publish" concurrency group
# so two submissions never run at once.
on:
  workflow_call:
    inputs:
      version:
        description: Release version x.y.z (CFBundleShortVersionString)
        type: string
        required: true
      tag:
        description: Release tag vX.Y.Z; the "What's New" diff ends at it
        type: string
        required: true
      ref:
        description: Commit or tag to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check App Store secrets
        id: gate
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MAS_CERT_DIST_P12: ${{ secrets.MAS_CERT_DIST_P12 }}
          MAS_CERT_INSTALLER_P12: ${{ secrets.MAS_CERT_INSTALLER_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          missing=""
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8 \
              MAS_CERT_DIST_P12 MAS_CERT_INSTALLER_P12 MAS_CERT_PASSWORD MAS_PROVISION_PROFILE; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -n "${missing}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Mac App Store publish skipped; missing secrets:${missing}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history + tags for the release-notes diff against the previous tag.
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # App Store Connect allows one macOS version in flight. While the
      # previous version is waiting for or in review, deliver cannot create
      # the new one ("You cannot create a new version of the App in the
      # current state"), so the lane defers: mas-catchup.yml submits the
      # latest release once Apple is done. Every later step runs only on
      # decision=publish.
      - name: Ask App Store Connect whether a new macOS version can be submitted
        id: state
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ inputs.version }}
        run: node .github/scripts/asc_mas_state.mjs --bundle-id com.neoanaloglab.negativeconverter --version "$VERSION"

      - name: Report a deferred or finished submission
        if: steps.gate.outputs.enabled == 'true' && steps.state.outputs.decision != 'publish'
        env:
          DECISION: ${{ steps.state.outputs.decision }}
          REASON: ${{ steps.state.outputs.reason }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$DECISION" = blocked ]; then
            echo "::warning::Mac App Store submission of $VERSION deferred: $REASON. The Mac App Store catch-up workflow submits the latest release once Apple is done."
          else
            echo "::notice::Mac App Store $VERSION: $REASON; nothing to submit."
          fi

      - name: Apply release version
        if: steps.state.outputs.decision == 'publish'
        run: node .github/scripts/set_tauri_version.mjs "${{ inputs.version }}"

      - name: Apply MAS bundle version
        if: steps.state.outputs.decision == 'publish'
        run: node .github/scripts/set_mas_bundle_version.mjs "${{ inputs.version }}" "${{ github.run_attempt }}" "${{ steps.state.outputs.min_build }}"

      - name: Setup Rust
        if: steps.state.outputs.decision == 'publish'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        if: steps.state.outputs.decision == 'publish'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        if: steps.state.outputs.decision == 'publish'
        run: npm ci

      - name: Import signing assets
        if: steps.state.outputs.decision == 'publish'
        env:
          MAS_CERT_DIST_P12: ${{ secrets.MAS_CERT_DIST_P12 }}
          MAS_CERT_INSTALLER_P12: ${{ secrets.MAS_CERT_INSTALLER_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/mas-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          # security import exits 1 on duplicates (the runner image already
          # ships Apple intermediates in its system keychain); tolerate only
          # that error so wrong-password failures still abort.
          import_tolerant() {
            local out
            if ! out="$(security import "$@" 2>&1)"; then
              if grep -q "already exists in the keychain" <<<"$out"; then
                echo "already in keychain, continuing"
              else
                printf '%s\n' "$out" >&2
                return 1
              fi
            fi
          }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          for var in MAS_CERT_DIST_P12 MAS_CERT_INSTALLER_P12; do
            CERT_PATH="$RUNNER_TEMP/$var.p12"
            echo "${!var}" | base64 --decode > "$CERT_PATH"
            import_tolerant "$CERT_PATH" \
              -P "$MAS_CERT_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"
          done

          # Both identities chain to the WWDR G3 intermediate; import it in
          # case the runner image lacks it (usually a tolerated duplicate).
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          import_tolerant "$RUNNER_TEMP/AppleWWDRCAG3.cer" -t cert -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "$MAS_PROVISION_PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Mac App Store package
        if: steps.state.outputs.decision == 'publish'
        run: npm run tauri:build:mas

      - name: Collect build metadata
        if: steps.state.outputs.decision == 'publish'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_PATH="$BUNDLE_DIR/Negative Converter.app"
          PKG_PATH="$BUNDLE_DIR/NegativeConverter-appstore.pkg"
          test -f "$PKG_PATH"

          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"

          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "Bundle version $APP_VERSION does not match release version $VERSION" >&2
            exit 1
          fi

          {
            echo "PKG_PATH=$GITHUB_WORKSPACE/$PKG_PATH"
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Generate release notes
        if: steps.state.outputs.decision == 'publish'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/release_notes.txt"
          prev="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)"
          if [ -n "$prev" ] && git rev-parse -q --verify "$prev^{commit}" >/dev/null; then
            git log --no-merges --pretty='format:- %s' "$prev..HEAD" | head -c 3500 > "$NOTES_PATH" || true
          else
            : > "$NOTES_PATH"
          fi
          echo "Release notes ($(wc -c < "$NOTES_PATH") bytes):"
          cat "$NOTES_PATH" || true
          echo "RELEASE_NOTES_PATH=$NOTES_PATH" >> "$GITHUB_ENV"

      - name: Upload and submit to App Store
        if: steps.state.outputs.decision == 'publish'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          node scripts/check-appstore-screenshots.mjs
          command -v fastlane >/dev/null || sudo gem install fastlane -N
          fastlane mac mas_upload

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
