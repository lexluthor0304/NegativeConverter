[package]
name = "negative-converter"
version = "1.0.12"
description = "Film negative to positive converter"
authors = ["neoanaloglab"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "negative_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["updater"]
# In-app updates via tauri-plugin-updater. The Mac App Store build turns this
# off (`scripts/build-mas.sh`): App Store apps must not update themselves.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
base64 = "0.23"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
