[package]
name = "negative-converter"
version = "1.0.12"
description = "Film negative to positive converter"
authors = ["neoanaloglab"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "negative_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the vendored LibRaw for the native RAW decoder (#264). Already in
# Cargo.lock (objc2-exception-helper, embed-resource and others build C with it).
cc = "1"

[features]
default = ["updater"]
# Only the local performance launcher enables this isolated cache path.
perf-harness = []
# In-app updates via tauri-plugin-updater. The Mac App Store build turns this
# off (`scripts/build-mas.sh`): App Store apps must not update themselves.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[dependencies]
notify = "8.2"
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Physical memory for the page's memory budget (get_memory_info, #258), and
# statvfs plus the Time Machine exclusion of the display-proxy cache (#249).
# Both versions are already in Cargo.lock (tauri's own dependencies).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# WebKitGTK's memory-pressure settings before the first webview (#282): run()
# sets wry's process-wide default through the wry instance Tauri builds the
# WebContext with. tauri-runtime-wry re-exports it and always unifies with
# tauri's own requirement (same major); a direct `wry = "0.55"` could become a
# second wry copy after a Tauri bump and the setting would go nowhere. No
# features: they unify with tauri's. Already in Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-wry = { version = "2", default-features = false }

# #282: that process-wide default is not in upstream wry. The fork is wry
# 0.55.1 (the version tauri 2.11.5 / tauri-runtime-wry 2.11.4 use) plus the
# `MemoryPressureSettings` API and `set_default_memory_pressure_settings`,
# branch nc/0.55.1-memory-pressure of https://github.com/lexluthor0304/wry;
# every platform compiles wry from this pin (the additions are Linux-only).
# When Tauri bumps wry, re-base that branch on the new wry-vX.Y.Z tag and
# update `rev`. Remove this section, the Linux dependency above and the fork
# once wry or Tauri expose the settings (docs/audit-backlog.md, "Build and
# release"; docs/memory-budget.md, "Linux").
[patch.crates-io]
wry = { git = "https://github.com/lexluthor0304/wry", rev = "7a6fbb061b7fb1183a85ad273281e63075d076f6" }

[dev-dependencies]
# RGB16 hashes in the native decoder's parity tests (#264). Already in
# Cargo.lock (tauri-codegen, wry).
sha2 = "0.10"
# The parity tests compare LibRaw's floats with the ones libraw-wasm reported
# (native/wasm-parity-hashes.json): parse them correctly rounded, not to the
# default best-effort precision (off by one ulp for some values). Tests only.
serde_json = { version = "1", features = ["float_roundtrip"] }
